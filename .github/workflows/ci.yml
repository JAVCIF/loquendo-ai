# Compila la solución y pasa las pruebas en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Compilar y probar (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: FFmpeg (pruebas de render y de exportación a VEGAS)
        run: choco install ffmpeg -y --no-progress

      - name: Compilar
        run: dotnet build LoquendoAI.sln -c Release

      - name: Pruebas
        # El código de salida es el número de pruebas fallidas.
        run: dotnet run --project tests/LoquendoAI.Tests/LoquendoAI.Tests.csproj -c Release --no-build
